{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Sign in{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block shell %}
<main class="auth-card card">
  <div class="auth-logo"><img src="{{ logo_url }}" alt="{{ company_name }}"></div>
  <h1>Sign in</h1>
  <p class="muted">Events, gear, crew and billing in one place.</p>
  {% if error %}<div class="flash flash-bad">{{ error }}</div>{% endif %}
  <form method="post">
    {{ csrf() }}
    <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</main>
{% endblock %}
