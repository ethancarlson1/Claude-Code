<div class="company">
  <img class="doc-logo" src="{{ logo_url }}" alt="{{ settings.company_name }}">
  <strong>{{ settings.company_name }}</strong>
  {% if settings.company_address %}<div class="pre">{{ settings.company_address }}</div>{% endif %}
  {% if settings.company_phone %}<div>{{ settings.company_phone }}</div>{% endif %}
  {% if settings.company_email %}<div>{{ settings.company_email }}</div>{% endif %}
</div>
