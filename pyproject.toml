[project]
name = "backline-ops"
version = "0.1.0"
description = "Scheduling, inventory, checklists, contracts and invoicing for an audio & backline company."
requires-python = ">=3.10"
dependencies = ["Flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
