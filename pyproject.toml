[project]
name = "chicago-sound-backline"
version = "0.1.0"
description = "Scheduling, inventory, crew worksheets, checklists, contracts and invoicing for Chicago Sound and Backline."
requires-python = ">=3.10"
dependencies = ["Flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
